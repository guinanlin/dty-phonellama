name: Build APK

on:
  push:
    branches: [dty, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set version from ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            echo "VERSION_NAME=${major}.${minor}.${patch}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev" >> "$GITHUB_ENV"
            echo "VERSION_CODE=1" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONELLAMA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::PHONELLAMA_KEYSTORE_BASE64 secret is not configured"
            exit 1
          }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phonellama-release.jks"

      - name: Build APK
        env:
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/phonellama-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.PHONELLAMA_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PHONELLAMA_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PHONELLAMA_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/PhoneLlama-${VERSION}.apk"
          ls -lh dist/

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLlama-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PhoneLlama ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/PhoneLlama-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
